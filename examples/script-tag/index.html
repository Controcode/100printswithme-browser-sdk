<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100PrintsWithMe Browser SDK v2</title>
  <style>
    body { margin: 2rem; font: 16px/1.5 system-ui, sans-serif; }
    #badge { display: block; max-width: 100%; height: auto; }
    #status { margin-top: 1rem; }
    #status.error { color: #b42318; }
  </style>
</head>

<body>
  <img id="badge" alt="Rendered badge">
  <p id="status" role="status" aria-live="polite">Preparing render…</p>

  <script src="../../dist/100prints-sdk.umd.js"></script>
  <script>
    const status = document.querySelector("#status");
    const badge = document.querySelector("#badge");

    function showError(error) {
      console.error("100Prints render failed:", error);
      const message = error?.details?.message || error?.cause?.message || error?.message || String(error);
      status.className = "error";
      status.textContent = `Could not render image${error?.code ? ` (${error.code})` : ""}: ${message}`;
    }

    if (location.protocol === "file:") {
      status.className = "error";
      status.textContent = "Serve this example over HTTP (run npm run dev from the sdk folder and open /examples/script-tag/). The SDK cannot fetch its API template reliably from a file:// page.";
    } else if (typeof window.HundredPrints !== "function") {
      status.className = "error";
      status.textContent = "SDK bundle did not load. Run npm run build from the sdk folder, then reload this page.";
    } else {
      const hp = new HundredPrints({ publishableKey: "pk_live_J0z-iDYEfqs0HQIdkgNyAP6rhwkbrPGL" });

      hp.renderTo(badge, {
        templateId: "39308b5d-d6cd-4d9d-9eb0-84e56b32482e",
        data: {
          StudentName: "Rishabh Dev",
          StudentID: "STU123456",
          Class: "10th Grade",
          Section: "A",
          Term: "First Term",
          AcademicYear: "2023-2024",
          Mathematics: 89,
          Physics: 96,
          Chemistry: 93,
          ComputerScience: 91,
          English: 73,
          Average: 92,
          Grade: "A",
          Attendance: "95%",
          Remarks: "Excellent performance throughout the term."
        },
        output: {
          format: "png",
          side: "front",
          quality: "high"
        }
      }).then(async () => {
        await badge.decode();
        status.textContent = "Image rendered.";
      }).catch(showError);
    }
  </script>
</body>

</html>
