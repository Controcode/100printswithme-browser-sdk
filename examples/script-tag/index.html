<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>100PrintsWithMe Browser SDK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f2e9;
      color: #181818;
      font-family: Inter, system-ui, sans-serif;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .logo {
      width: 190px;
      max-width: 50%;
    }

    .tag {
      padding: 7px 12px;
      border: 2px solid #181818;
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .card {
      background: #fff;
      border: 2px solid #181818;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 7px 7px 0 #181818;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #555;
      max-width: 620px;
    }

    .preview-box {
      min-height: 260px;
      padding: 18px;
      display: grid;
      place-items: center;
      border: 2px dashed #181818;
      border-radius: 12px;
      background: #f8f8f8;
    }

    #preview {
      display: none;
      width: 100%;
      height: auto;
      border: 2px solid #181818;
      border-radius: 8px;
    }

    #status {
      margin: 16px 0 0;
      font-weight: 700;
    }

    #status.error {
      color: #b42318;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      appearance: none;
      border: 2px solid #181818;
      border-radius: 10px;
      padding: 11px 18px;
      background: #fff;
      color: #181818;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 4px 4px 0 #181818;
      transition:
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #181818;
    }

    button:active:not(:disabled) {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    button.primary {
      background: #ffe66d;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #666;
    }

    code {
      padding: 2px 6px;
      border-radius: 5px;
      background: #ececec;
    }

    @media (max-width: 600px) {
      .page {
        margin: 24px auto;
      }

      .header {
        align-items: flex-start;
      }

      .card {
        padding: 20px;
        box-shadow: 5px 5px 0 #181818;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <img
        class="logo"
        src="https://www.100printswith.me/logo-100printswithme.png"
        alt="100PrintsWithMe"
      />

      <span class="tag">Browser SDK v2</span>
    </header>

    <section class="card">

      <h1>Render in the browser.</h1>

      <p class="subtitle">
        A tiny script-tag example using a 100PrintsWithMe template.
        Render a PNG preview and download the same template as PDF.
      </p>

      <div class="preview-box">
        <img id="preview" alt="Rendered report card" />
        <span id="placeholder">Your rendered template appears here.</span>
      </div>

      <p id="status" role="status" aria-live="polite">
        Preparing render…
      </p>

      <div class="actions">
        <button
          id="download-image"
          class="primary"
          disabled
        >
          Download PNG
        </button>

        <button id="download-pdf">
          Download PDF
        </button>
      </div>

      <div class="footer">
        Powered by
        <code>@100printswithme/browser-sdk</code>
      </div>

    </section>

  </main>

  <script src="../../dist/100prints-sdk.umd.js"></script>

  <script>
    const status = document.querySelector("#status");
    const preview = document.querySelector("#preview");
    const placeholder = document.querySelector("#placeholder");
    const imageButton = document.querySelector("#download-image");
    const pdfButton = document.querySelector("#download-pdf");
    
    // configure your own templateId from 100PrintsWithMe dashboard
    const templateId =
      "39308b5d-d6cd-4d9d-9eb0-84e56b32482e";
    
    // Update the data object below to match your template's fields
    const data = {
      StudentName: "Krishna",
      StudentID: "STU123456",
      Class: "10th Grade",
      Section: "A",
      Term: "First Term",
      AcademicYear: "2023-2024",
      Mathematics: 89,
      Physics: 96,
      Chemistry: 93,
      ComputerScience: 91,
      English: 73,
      Average: 92,
      Grade: "A",
      Attendance: "95%",
      Remarks: "Excellent performance throughout the term."
    };

    function showError(error) {
      console.error("100Prints render failed:", error);

      status.className = "error";
      status.textContent =
        error?.message ||
        "Something went wrong while rendering.";
    }

    if (location.protocol === "file:") {

      status.className = "error";
      status.textContent =
        "Run this example using npm run dev instead of file://";

    } else if (
      typeof window.HundredPrints !== "function"
    ) {

      status.className = "error";
      status.textContent =
        "SDK bundle not found. Run npm run build.";

    } else {

      const prints = new HundredPrints({
        publishableKey: "pk_live_J0z-iDYEfqs0HQIdkgNyAP6rhwkbrPGL"
      });

      prints.renderTo(preview, {
        templateId,
        data,

        output: {
          format: "png",
          side: "front",
          quality: "high"
        }
      })
      .then(async (result) => {

        await preview.decode();

        placeholder.style.display = "none";
        preview.style.display = "block";

        imageButton.disabled = false;
        status.textContent = "Render complete ✓";

        imageButton.addEventListener("click", () => {
          result.download("report-card.png");
        });

      })
      .catch(showError);

      pdfButton.addEventListener("click", async () => {

        try {

          pdfButton.disabled = true;
          pdfButton.textContent = "Generating PDF…";

          const pdf = await prints.pdf({
            templateId,
            data,
            includeBack: true,
            quality: "high"
          });

          pdf.download("report-card.pdf");

        } catch (error) {

          showError(error);

        } finally {

          pdfButton.disabled = false;
          pdfButton.textContent = "Download PDF";

        }

      });

    }
  </script>
</body>
</html>
